# Build and test on every push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown

      - name: Simulation core (Rust unit tests, prebuilt up to date)
        run: |
          cargo test --release --manifest-path sim/Cargo.toml
          node tools/build-sim.mjs --check

      - name: Production build (sim.wasm rebuilt from sim/ by cargo)
        run: npm run build:prod

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests on the WASM simulation (smoke, full ritual, co-op, knife, perf budget, wasm-sim)
        run: npm test

      - name: Run tests on the JavaScript fallback (?sim=js)
        run: npm run test:js

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  qa:
    name: Soak tests (leaks, co-op sync)
    runs-on: ubuntu-latest
    # long stress run: reports results but never blocks the Pages deploy
    continue-on-error: true
    timeout-minutes: 30
    # reported but not blocking (Pages deploys anyway) while known leaks are open; remove once they pass
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Soak tests
        run: npm run test:qa

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: soak-report
          path: test-results/
          retention-days: 7

  desktop:
    name: Desktop shell (Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build:prod

      - name: Launch the app under a virtual display
        env:
          ASHFALL_DESKTOP_TEST: '1'
        run: xvfb-run -a npm test -- desktop

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: desktop-report
          path: test-results/
          retention-days: 7
