<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ashfall Excavation app icon (original artwork). Regenerate PNG/ICO/ICNS with: npm run icons -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3a2a1e"/>
      <stop offset=".65" stop-color="#1a130e"/>
      <stop offset="1" stop-color="#0c0907"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9fdff"/>
      <stop offset=".35" stop-color="#7fe3f2"/>
      <stop offset=".75" stop-color="#1f8ea6"/>
      <stop offset="1" stop-color="#0a2a33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c08a"/>
      <stop offset="1" stop-color="#8a6a36"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3c22"/>
      <stop offset="1" stop-color="#3e2112"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#c9a35a" stroke-width="10" opacity=".85"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#7a3a1e" stroke-width="8" stroke-dasharray="26 14"/>
  <!-- glowing lodestone crystal -->
  <circle cx="256" cy="232" r="128" fill="url(#core)" opacity=".9"/>
  <path d="M256 104 L312 232 L256 360 L200 232 Z" fill="#e6fcff"/>
  <path d="M256 104 L312 232 L256 232 Z" fill="#9ff0ff"/>
  <path d="M256 360 L200 232 L256 232 Z" fill="#5fc6da"/>
  <!-- crossed pickaxe and shovel -->
  <g transform="rotate(-38 256 300)">
    <rect x="242" y="196" width="28" height="236" rx="10" fill="url(#haft)"/>
    <path d="M150 210 Q256 150 362 210 L350 226 Q256 186 162 226 Z" fill="url(#steel)" stroke="#2a1a10" stroke-width="5"/>
  </g>
  <g transform="rotate(38 256 300)">
    <rect x="244" y="190" width="24" height="200" rx="9" fill="url(#haft)"/>
    <path d="M222 380 L290 380 L290 426 Q256 466 222 426 Z" fill="url(#steel)" stroke="#2a1a10" stroke-width="5"/>
  </g>
  <!-- falling ash embers -->
  <circle cx="132" cy="140" r="9" fill="#ff9a40"/>
  <circle cx="384" cy="118" r="7" fill="#ff9a40"/>
  <circle cx="404" cy="356" r="8" fill="#ffb060"/>
  <circle cx="112" cy="370" r="6" fill="#9ff3ff"/>
</svg>
